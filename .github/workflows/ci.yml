name: Soroban ZK Standard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 🚨 Enforce Formatting
        run: cargo fmt --all -- --check

      - name: 🔍 Strict Linting
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Run Tests
        run: cargo test --release

      - name: 🔨 Build WASM (verifier-sample contract)
        run: cargo build --target wasm32v1-none --release -p verifier-sample

      - name: 🛡️ Audit Dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

  property-based-and-fuzzing:
    name: 🧬 Property-Based & Fuzzing Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-prop-${{ hashFiles('**/Cargo.lock') }}

      # Property-based math tests (Phase 1), differential tests vs arkworks
      # (Phase 2), and malformed-input/curve-validation/XDR fuzzing (Phase 3).
      # These run in debug (fast to compile) and are intentionally bounded in
      # case-count so the pseudo-random fuzzing finishes well within CI limits.
      # proptest logs the PRNG seed and minimal failing input on any failure,
      # satisfying the determinism requirement.
      - name: 🧪 Run Property-Based & Fuzzing Tests
        run: |
          cargo test -p soroban-zk-core \
            --test proptest_fq \
            --test proptest_boundary \
            --test differential_ark \
            --test fuzz_curve_validation \
            --test fuzz_xdr

  miri-check:
    name: 🔬 Memory Safety (Miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nightly Rust + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Disable vendoring for Miri
        run: rm -f .cargo/config.toml

      - name: 🧪 Run Miri on soroban-zk-core library
        run: cargo +nightly miri test -p soroban-zk-core --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: 🧪 Run native integration tests
        run: cargo +nightly test -p soroban-zk-core --test eip196_vectors

  wasm-size-check:
    name: 📦 WASM 64KB Limit Check
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build verifier-sample Contract WASM
        run: cargo build --release --target wasm32v1-none -p verifier-sample

      - name: Check WASM Size
        run: |
          WASM_FILE="target/wasm32v1-none/release/verifier_sample.wasm"

          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ Error: verifier_sample.wasm not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$WASM_FILE")
          MAX_SIZE=65536

          echo "WASM size: $SIZE bytes / $MAX_SIZE bytes max"

          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "❌ CRITICAL: WASM exceeds 64KB limit ($SIZE bytes)"
            exit 1
          else
            echo "✅ SUCCESS: $SIZE bytes — within limit"
          fi
